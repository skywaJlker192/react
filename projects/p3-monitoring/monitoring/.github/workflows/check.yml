name: Ночная проверка сайтов

on:
  schedule:
    # 21:00 UTC = 00:00 по Москве
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Проверить сайты
        run: node scripts/check.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Сохранить результаты коммитом
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/results.json
          if git diff --cached --quiet; then
            echo "Результаты не изменились"
          else
            git commit -m "Ночная проверка сайтов"
            git push
          fi

  # Коммит бота не запускает deploy.yml сам (защита GitHub от циклов),
  # поэтому публикацию вызываем отсюда после проверки.
  publish:
    needs: check
    uses: ./.github/workflows/deploy.yml
