name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/results.json'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Скачать код
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать сайт
        run: npm run build

      - name: Копия index.html для прямых ссылок
        run: cp dist/index.html dist/404.html

      - name: Подготовить файлы для Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
